server:
  port: 9528
spring:
  servlet:
    multipart:
      max-file-size: 100MB  # 单个文件最大大小
      max-request-size: 100MB  # 总请求体大小
  application:
    name: wtlx
  # ==================== 业务主数据源（MySQL） ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wtlx?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: 1234
  # ==================== AI 能力（原 TripAgent 收口） ====================
  ai:
    # ---- 对话模型：走阿里云百炼「OpenAI 兼容模式」，支持 qwen3.x / deepseek-v4 新模型 ----
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      # 阿里云百炼兼容模式根地址，客户端会自动拼 /v1/chat/completions
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3.7-flash
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      # DashScope 客户端仅用于 Embedding（text-embedding-v3 在旧版 REST 路径下正常可用）
      embedding:
        options:
          # text-embedding-v3 向量维度为 1024，需与 pgvector.dimensions 保持一致
          model: text-embedding-v3
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json
    # PGVector 向量库配置（独立于业务 MySQL 数据源）
    vectorstore:
      pgvector:
        # 自动创建 pgvector 扩展与向量表
        initialize-schema: true
        # 向量维度（text-embedding-v3 = 1024）
        dimensions: 1024
        # 索引类型与距离度量
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        schema-name: public
        table-name: vector_store
  data:
    redis:
      host: 192.168.150.101
      # host: 127.0.0.1
      port: 6379
      password: 123321
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 0
          time-between-eviction-runs: 10s
      database: 0
  rabbitmq:
    host: 192.168.150.101
    port: 5672
    virtual-host: /tjxt
    username: tjxt
    password: 123321
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          multiplier: 2
          max-attempts: 3
          stateless: true
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段

# ==================== AI 数据源（PostgreSQL + pgvector，自定义前缀） ====================
ai:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://192.168.150.101:5432/vector_db
    username: postgres
    password: 123456

mybatis-plus:
  type-aliases-package: com.wtlx.domain.entity

# ==================== AI 对话记忆配置 ====================
# 摘要压缩的保留轮数 / 触发阈值 / 摘要长度上限是常量，写在
# ConversationMemoryServiceImpl 与 SummaryCompressorImpl 里，此处不配（配了也没人读）
trip-agent:
  # RAG 检索：来源为站内游记（BLOG）与官方攻略（GUIDE）
  rag:
    enabled: true
    # 单个切片目标字符数与重叠字符数
    chunk-size: 500
    chunk-overlap: 80
    # 单个来源最大切片数
    max-chunks: 50
    # 单批 embedding 条数（DashScope text-embedding 接口上限 10）
    embedding-batch-size: 10
    # Agent 检索工具参数（阈值偏松，保留召回，由模型判断相关性）
    # 实测：相关查询 top5 落在 0.62~0.71，无关查询（如"帮我写一段Java代码"）最高 0.46
    search-threshold: 0.5
    # 给模型的上下文条数
    search-top-k: 5
    # 宽召回条数：一次检索同时服务"给模型的上下文"与"卡片候选"，
    # 必须不小于 search-top-k 与 card-top-k，否则卡片候选会被给模型的条数截断
    candidate-top-k: 8
    # 前端卡片取用条数与阈值（低于阈值视为未命中，不渲染卡片区）
    # 卡片直接暴露给用户，阈值比检索更严：0.55 高于无关查询上限 0.46，低于相关查询下限 0.62
    card-top-k: 4
    card-threshold: 0.55
    # 启动时是否对缺失索引的来源做全量回填（量大时建议关闭，改由管理接口触发）
    rebuild-on-startup: false

  # ==================== 用户长期记忆（跨会话） ====================
  # 短期记忆（摘要 + 最近轮次）的保留轮数 / 阈值是常量，写在
  # ConversationMemoryServiceImpl 与 SummaryCompressorImpl 里；
  # 这里是长期记忆（user_memory 表 + pgvector）的全部可调参数。
  #
  # 注意：相似度类阈值按 DashScope text-embedding-v3（1024 维）实测标定，
  # 换 embedding 模型或换抽取模型必须重新标定，否则会出现
  # "该合并的没合并（冗余累积）"或"不该合并的被覆盖（偏好被误改）"。
  memory:
    enabled: true
    # ---- 抽取（异步子 Agent，段级触发）----
    extraction-enabled: true
    # 每累计多少轮对话触发一次"该段会话记录"的提取（写入链路简化为"每 N 轮抽一段"）
    extraction-every-rounds: 10
    # 单次抽取覆盖的段大小（轮）：实际加载最近 2*N 条消息
    segment-max-rounds: 10
    # 候选低于该置信度直接丢弃
    extraction-min-confidence: 0.35
    # 单段候选数上限
    extraction-max-candidates: 8
    extraction-pool-size: 2
    # ---- 合并与冲突校验 ----
    # 相似度 ≥ 0.92 视为同一事实的不同表述（不新增）
    duplicate-similarity: 0.92
    # 相似度 < 0.60 视为无关（直接新增）；0.60~0.92 之间交冲突判定模型裁决
    conflict-similarity: 0.60
    conflict-judge-enabled: true
    semantic-search-top-k: 5
    # ---- 检索（单路向量）----
    retrieval-top-n: 8
    # 语义向量召回条数
    vector-top-k: 12
    vector-threshold: 0.45
    # ---- 上下文注入 ----
    # 注入模型的记忆文本字符上限（记忆是每轮固定开销，必须封顶）
    context-max-chars: 900
    stable-max-items: 8
    ephemeral-max-items: 4

# ==================== 接口文档 ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

tj:
  xxl-job:
    access-token: tianji
    admin:
      address: http://192.168.150.101:8880/xxl-job-admin
    executor:
      appname: ${spring.application.name}
      log-retention-days: 10
      logPath: job/${spring.application.name}
logging:
  level:
    com.wtlx: debug
